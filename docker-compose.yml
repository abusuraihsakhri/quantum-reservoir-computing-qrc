version: '3.8'

services:
  quantum-reservoir-computing-qrc:
    build: .
    container_name: quantum-reservoir-computing-qrc
    ports:
      - "8000:8000"
    environment:
      - AUDIT_SECRET_KEY=quantum-reservoir-computing-qrc-prod-audit-key-2026
      - MODEL_PROVIDER=mock
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
