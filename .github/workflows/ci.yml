name: Tests and security checks

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install project and test dependencies
        run: python -m pip install -e ".[server,dev]"
      - name: Compile source files
        run: python -m compileall -q agents quantum_reservoir cli.py enrichment.py simulator.py
      - name: Run Python tests
        run: python -m pytest -q
      - name: Smoke-test installed command and batch export
        run: |
          quantum-reservoir-computing-qrc --help
          quantum-reservoir-computing-qrc batch -i sample.csv -o /tmp/qrc-evaluation-results.csv
          python simulator.py 10
      - name: Run dependency audit
        run: |
          python -m pip install pip-audit
          python -m pip_audit --progress-spinner off

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check browser JavaScript syntax
        run: node --check web/app.mjs
      - name: Run browser evaluator tests
        run: node --test tests/web.test.mjs
