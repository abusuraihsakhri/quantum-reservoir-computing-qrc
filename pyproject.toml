[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "quantum-reservoir-computing-qrc"
version = "2.0.0"
description = "Quantum Reservoir Computing Non-Linear Time-Series Engine"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security/Cryptography",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = []

[project.scripts]
quantum-reservoir-computing-qrc = "quantum_reservoir.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/quantum-reservoir-computing-qrc"
Repository = "https://github.com/abusuraihsakhri/quantum-reservoir-computing-qrc.git"
