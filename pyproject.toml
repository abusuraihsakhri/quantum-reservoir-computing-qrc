[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "quantum-reservoir-computing-qrc"
version = "2.0.0"
description = "Quantum Reservoir Computing Non-Linear Time-Series Engine"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security/Cryptography",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = ["pydantic>=2.0,<3"]

[project.optional-dependencies]
server = ["fastapi>=0.100,<1", "uvicorn>=0.23,<1"]
dev = ["pytest>=8,<10", "httpx>=0.27,<1"]

[project.scripts]
quantum-reservoir-computing-qrc = "quantum_reservoir.cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/quantum-reservoir-computing-qrc"
Repository = "https://github.com/abusuraihsakhri/quantum-reservoir-computing-qrc.git"

[tool.setuptools.packages.find]
include = ["agents*", "quantum_reservoir*"]
